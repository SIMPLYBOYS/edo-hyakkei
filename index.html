<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>名所江戶百景・漫遊記</title>
<style>
  :root { --sea:#1b3a56; --land:#e9e1cf; --ink:#2a2622; --river:#4d7fa3; --gold:#c9a227;
          /* 圖框外。與 --sea 同色系但更暗——不然灣內的海會跟框外連成一片 */
          --off:#101d29; }
  * { box-sizing:border-box; margin:0 }
  body { background:var(--off); color:var(--land); height:100vh; overflow:hidden;
         font-family:"Hiragino Mincho ProN","Yu Mincho",serif }
  #map { display:block; width:100vw; height:100vh; cursor:grab; touch-action:none }
  #map:active { cursor:grabbing }

  /* 玩家點畫在最上層，不擋掉底下景點的點擊——紅點一定停在剛去過的景上面 */
  #player { pointer-events:none }
  /* 不在季的景。.28 太淡了——開局只有 13 個點在圖上（§2.6），
     其中 9 個是這種，淡到看不見會讓地圖顯得比實際更空。 */
  .mark circle { fill:var(--ink); opacity:.45; transition:opacity .3s,fill .3s }
  /* 標記整組由 map.js 套 scale() 縮回螢幕尺度，所以這裡的數字就是螢幕像素。
     先前圓點與字都是地圖單位，拉近時會脹成蓋住地圖的大圓餅。 */
  .mark text { font-size:13px; fill:var(--ink); opacity:0; paint-order:stroke;
               stroke:var(--land); stroke-width:4; pointer-events:none; transition:opacity .3s }
  .mark.open circle { fill:var(--gold); opacity:1 }
  #map.zoomed .mark.open text { opacity:1 }
  .mark.got circle { fill:#7a9a6d; opacity:.9 }
  /* §2.8 收過的景把地名留在圖上——歲時記把自己寫回地圖。
     顏色跟著 .got 的點走，一眼分得出「我去過」與「這季可收」。 */
  #map.zoomed .mark.got text { opacity:.9; fill:#4f6b45 }
  /* 被避讓擠掉的景名。用 class 而非 inline display，:hover 才叫得回來 */
  #map.zoomed .mark.open text.crowded, #map.zoomed .mark.got text.crowded { opacity:0 }

  /* 可收的景擴一圈暈。金點是全圖唯一「按下去會發生事」的東西，
     不動的話跟灰點只差顏色。形狀畫在原點（見 map.js），所以 scale 就是繞自己的中心。
     慢、淡、錯開——這是水墨調的地圖，不是通知紅點。 */
  .mark .pulse { fill:var(--gold); opacity:0; pointer-events:none }
  .mark.open .pulse { animation:ripple 2.8s ease-out infinite }
  @keyframes ripple {
    0%        { transform:scale(1);   opacity:.45 }
    60%, 100% { transform:scale(3.2); opacity:0 }
  }
  /* 會暈車的人把動畫關掉是基本的，不是可選項 */
  @media (prefers-reduced-motion:reduce) { .mark.open .pulse { animation:none } }

  /* 滑鼠回饋。點得到的東西要看起來點得到——不在季的景點下去也有話說
     （會告訴你那是哪一季的景），所以一律給 pointer。 */
  .mark { cursor:pointer }
  .mark:hover circle { stroke:#fffdf5; stroke-width:2.5 }
  .mark:hover > circle:not(.ring) { opacity:1 }
  /* hover 一律看得到名字，連被避讓擠掉的也是——這是擠掉之後唯一的救濟。
     !important 是為了蓋過上面那條 id 選擇器，不是偷懶。 */
  .mark:hover text { opacity:1 !important }
/* §2.6 還沒出版的景整個不存在——地圖隨遊戲內時間一張張長出來。
   用 display:none 而非 opacity:0，否則滑鼠仍會 hover 到看不見的東西。 */
.mark.unpub { display:none }
  .mark .ring { fill:none; stroke:var(--gold); stroke-width:1.5; opacity:.35; pointer-events:none }
  .mark.open .ring { opacity:1 }
  /* 視線扇形：畫成扇不畫成箭頭，因為方位有 ±30° 不確定度（見 §7-15） */
  .mark .cone { fill:var(--gold); opacity:0; pointer-events:none; transition:opacity .3s }
  .mark.open .cone, .mark.got .cone { opacity:.22 }
  .mark:hover text { opacity:1 }

  /* §2.7 江戶地名。font-size 與 stroke-width 由 map.js 每次縮放時設在 #places 上，
     用來抵銷 viewBox 縮放——寫死在這裡的話一拉近字就變巨大。 */
  #places text { fill:#33506b; paint-order:stroke; stroke:var(--land);
                 text-anchor:middle; pointer-events:none; opacity:.8 }
  #places .garden { fill:#55703f }
  #places .river, #places .canal { font-style:italic }

  #hud { position:fixed; left:0; right:0; top:0; padding:14px 20px; display:flex;
         gap:18px; align-items:baseline; background:linear-gradient(#0e2233dd,transparent) }
  #date { font-size:22px; letter-spacing:.1em }
  /* 西元擺在和曆後面、小一級：和曆是這個遊戲的語氣，西元是給人對得上年代的 */
  #date .ad { font-size:13px; opacity:.5; letter-spacing:.06em; margin-left:12px;
              font-family:ui-monospace,SFMono-Regular,Menlo,monospace }
  #left, #count { font-size:13px; opacity:.75 }
  #count { margin-left:auto }
  button { font:inherit; font-size:13px; color:var(--land); background:#ffffff1a;
           border:1px solid #ffffff33; border-radius:3px; padding:5px 12px; cursor:pointer }
  button:hover { background:#ffffff2e }
  button.ghost { background:none }

  #bar { position:fixed; left:0; right:0; bottom:0; padding:12px 20px 18px; text-align:center;
         background:linear-gradient(transparent,#0e2233cc 40%) }
  #era { width:min(420px,60vw); accent-color:var(--gold); vertical-align:middle }
  #bar label { font-size:12px; opacity:.7; margin:0 10px }
  #attr { font-size:10px; opacity:.4; margin-top:6px }   /* ODbL 要求標示出處 */

  /* 縮放控制：快捷鍵藏著等於不存在，要有看得見的按鈕 */
  #zoom { position:fixed; right:20px; bottom:96px; display:flex; flex-direction:column; gap:1px }
  #zoom button { width:38px; height:38px; padding:0; font-size:17px; line-height:1;
                 background:#0e2233d9; border:1px solid #ffffff2e; border-radius:0 }
  #zoom button:first-child { border-radius:4px 4px 0 0 }
  #zoom button:last-child { border-radius:0 0 4px 4px; font-size:12px; height:30px }
  #zoom button + button { border-top:none }
  #zoom button:disabled { opacity:.3; cursor:default; background:#0e2233d9 }

  /* 開場失敗時唯一看得到的東西。白畫面查過兩輪，不要再有第三輪。 */
  #err { position:fixed; inset:auto 0 0 0; margin:auto; top:50%; transform:translateY(-50%);
         max-width:520px; padding:22px 26px; background:#3a1f1f; border:1px solid #ffffff2e;
         border-radius:4px; text-align:center; line-height:2; z-index:99 }
  #err code { display:block; font-size:12px; opacity:.8; word-break:break-all; margin:8px 0 }
  #err small { font-size:12px; opacity:.55 }

  #toast { position:fixed; left:50%; top:64px; transform:translateX(-50%); padding:9px 18px;
           background:#0e2233ee; border:1px solid #ffffff2e; border-radius:3px; font-size:14px;
           opacity:0; pointer-events:none; transition:opacity .3s }
  #toast.on { opacity:1 }

  .overlay { position:fixed; inset:0; background:#0b1a28f2; display:grid; place-items:center;
             padding:24px; overflow:auto; z-index:10 }
  .overlay figure { display:flex; gap:28px; align-items:center; max-width:1100px }
  .overlay img { max-height:82vh; max-width:56vw; box-shadow:0 8px 40px #0008 }
  /* 圖會是橫幅跨頁，跟直幅的百景比例差很多，放寬一點才看得清地名 */
  .overlay img.zue { max-width:66vw }
  figcaption .hint { font-size:12px; opacity:.5; margin-top:14px; line-height:1.7 }
  figcaption { max-width:300px }
  figcaption .no { font-size:12px; opacity:.6; letter-spacing:.2em }
  figcaption h2 { font-size:30px; margin:6px 0; font-weight:400 }
  figcaption .ro { font-size:14px; opacity:.8 }
  figcaption .en { font-size:13px; opacity:.55; margin-top:4px }
  figcaption .pub { font-size:12px; opacity:.45; margin-top:10px }
  .plate { position:relative; display:inline-block; line-height:0 }
  /* 找到的地方才顯示——標在前面就變成看圖說故事 */
  .found { position:absolute; transform:translate(-50%,-50%); border:2px solid var(--gold);
           border-radius:50%; pointer-events:none; animation:pop .4s ease-out }
  @keyframes pop { from { transform:translate(-50%,-50%) scale(1.6); opacity:0 } }
  .hunt { font-size:13px; color:var(--gold); margin-top:16px; line-height:1.7 }
  #tally { font-size:13px; opacity:0; max-height:0; transition:opacity .4s; line-height:1.8 }
  #tally.on { opacity:.85; max-height:none; margin-top:10px }
  #tally b { display:block; color:var(--gold); font-weight:400; margin-bottom:2px }
  .act { margin-top:22px; display:flex; gap:10px; flex-wrap:wrap }

  /* 結局。收滿 118 景時唯一會出現的畫面，安靜一點——
     這是一段走完的路，不是通關獎勵。 */
  .ending .sheet { background:#12283c; border:1px solid #ffffff1f; padding:34px 40px;
                   max-width:520px; text-align:center; line-height:2 }
  .ending h2 { font-weight:400; font-size:26px; letter-spacing:.3em; margin-bottom:6px }
  .ending .date { font-size:18px; letter-spacing:.1em; opacity:.85; margin-bottom:14px }
  .ending .note { font-size:13px; opacity:.7; margin-top:14px; text-align:left }
  .ending .note.dim { opacity:.45; font-size:12px }
  .ending .act { justify-content:center }
  /* §2.9 史實事件。標題在日期下面——先知道是哪一天，才知道這件事離你多遠 */
  .event h2 { font-size:22px; letter-spacing:.15em; margin:2px 0 10px }
  .event .date { font-size:13px; opacity:.6; letter-spacing:.05em; margin:0 }
  .event .date .dim { opacity:.5 }
  /* 資料觀察與史實敘述要分開，否則讀起來像因果 */
  .event .note.seen { border-left:2px solid #ffffff2e; padding-left:12px;
                      margin-top:16px; font-size:12px; opacity:.6 }

  .zukan .sheet { background:#12283c; border:1px solid #ffffff1f; padding:22px 26px;
                  max-width:1000px; width:100% }
  .zukan header { display:flex; align-items:baseline; gap:14px; margin-bottom:14px }
  .zukan header h2 { font-weight:400; letter-spacing:.12em }
  .zukan header span { opacity:.6; font-size:13px }
  .zukan header button { margin-left:auto }
  .zukan h3 { font-weight:400; font-size:16px; margin:14px 0 6px; opacity:.85 }
  .zukan h3 span { font-size:12px; opacity:.55; margin-left:8px }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(58px,1fr)); gap:5px }
  .cell { position:relative; aspect-ratio:2/3; background:#ffffff0d; border:1px solid #ffffff14;
          display:grid; place-items:center }
  .cell b { font-size:10px; opacity:.35; font-weight:400 }
  .cell img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover }
  .cell.has b { display:none }
</style>

<svg id="map"></svg>

<div id="hud">
  <span id="date"></span>
  <span id="left"></span>
  <span id="count"></span>
  <button id="book">歲時記</button>
  <button id="reset" class="ghost">重來</button>
</div>

<div id="toast"></div>

<div id="zoom">
  <button id="zin" title="放大（+ 或雙擊）">＋</button>
  <button id="zout" title="縮小（−）">−</button>
  <button id="zfit" title="全圖（0）">全図</button>
</div>

<div id="bar">
  <label>2026 現在</label>
  <input type="range" id="era" min="0" max="1000" value="1000">
  <label>安政五年 1858</label>
  <div id="attr">街圖資料 © OpenStreetMap contributors（ODbL）</div>
</div>

<script type="module" src="src/main.js"></script>
